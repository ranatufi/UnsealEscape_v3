name: Build UnsealEscape

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: windows-x64
            platform: windows
          - runner: macos-15
            artifact: macos-arm64
            platform: macos
          - runner: macos-15-intel
            artifact: macos-x64
            platform: macos

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build executable or app
        run: python -m PyInstaller --noconfirm --clean UnsealEscape.spec

      - name: Package macOS app
        if: matrix.platform == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent dist/UnsealEscape.app dist/UnsealEscape-${{ matrix.artifact }}.zip

      - name: Upload Windows executable
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: UnsealEscape-${{ matrix.artifact }}
          path: dist/UnsealEscape.exe
          if-no-files-found: error

      - name: Upload macOS app
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: UnsealEscape-${{ matrix.artifact }}
          path: dist/UnsealEscape-${{ matrix.artifact }}.zip
          if-no-files-found: error
